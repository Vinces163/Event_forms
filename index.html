<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Registration Page -->
    <div id="registration-page" class="page active">
        <div class="container">
            <h2>Event Registration Form</h2>

            <form id="registration-form">
                <label for="fullname">Full Name</label>
                <input id="fullname" name="fullname" type="text" placeholder="Enter your name" required>

                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="Enter your email" required>

                <label for="phone">Phone Number</label>
                <input id="phone" name="phone" type="tel" placeholder="Enter phone number" required>

                <label for="event">Select Event</label>
                <select id="event" name="event" required>
                    <option value="">Choose Event</option>
                    <option>Tech Conference</option>
                    <option>Hackathon</option>
                    <option>Workshop</option>
                    <option>Seminar</option>
                </select>

                <label for="event-date">Event Date</label>
                <input id="event-date" name="event-date" type="date" required>

                <label>Gender</label>
                <div class="radio-group">
                    <input id="male" type="radio" name="gender" value="male">
                    <label for="male">Male</label>

                    <input id="female" type="radio" name="gender" value="female">
                    <label for="female">Female</label>

                    <input id="other" type="radio" name="gender" value="other">
                    <label for="other">Other</label>
                </div>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Any notes..."></textarea>

                <button type="submit">Register</button>
            </form>
        </div>
    </div>

    <!-- Confirmation Page -->
    <div id="confirmation-page" class="page">
        <div class="container">
            <div class="confirmation-content">
                <h2>✓ Registration Successful!</h2>
                <p class="confirmation-message">Thank you for registering for the event.</p>
                
                <div class="confirmation-details">
                    <h3>Your Registration Details:</h3>
                    <p><strong>Name:</strong> <span id="confirm-name"></span></p>
                    <p><strong>Email:</strong> <span id="confirm-email"></span></p>
                    <p><strong>Phone:</strong> <span id="confirm-phone"></span></p>
                    <p><strong>Event:</strong> <span id="confirm-event"></span></p>
                    <p><strong>Date:</strong> <span id="confirm-date"></span></p>
                    <p><strong>Gender:</strong> <span id="confirm-gender"></span></p>
                </div>

                <button id="back-button" class="secondary-button">Register Another Person</button>
            </div>
        </div>
    </div>

    <script src="routing.js"></script>
</body>
</html>
